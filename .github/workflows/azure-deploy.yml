name: Deploy Kitchen Excursion to Azure

on:
  push:
    branches:
      - main
    paths:
      - 'KitchenExcursion.Api/**'
      - '.github/workflows/azure-deploy.yml'
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: kitchen-excursion
  PROJECT_PATH: KitchenExcursion.Api/KitchenExcursion.Api.csproj
  PUBLISH_PATH: ${{ github.workspace }}/publish

jobs:
  build-and-deploy:
    runs-on: windows-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore "${{ env.PROJECT_PATH }}"

      - name: Build
        run: dotnet build "${{ env.PROJECT_PATH }}" --configuration Release --no-restore

      - name: Publish
        run: dotnet publish "${{ env.PROJECT_PATH }}" --configuration Release --no-build --output "${{ env.PUBLISH_PATH }}"

      - name: Write build info
        shell: pwsh
        run: |
          $commit = "${{ github.sha }}".Substring(0,7)

          $buildInfo = @{
            app = "Kitchen Excursion"
            version = "0.3.1"
            commit = $commit
            builtAt = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          } | ConvertTo-Json

          $buildInfo | Set-Content `
            -Path "${{ env.PUBLISH_PATH }}/build-info.json" `
            -Encoding utf8

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: Production
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ env.PUBLISH_PATH }}